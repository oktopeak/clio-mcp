name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:no-secrets
        env:
          KNOWN_SECRET_FINGERPRINT: ${{ secrets.CLIO_LISTED_CLIENT_SECRET }}
