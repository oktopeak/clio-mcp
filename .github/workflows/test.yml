name: CI

# Two PRs were merged into this repository with no checks at all, because no
# workflow existed on the default branch. Both compiled and both passed their
# tests, but nothing on GitHub said so.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run verify:no-secrets
